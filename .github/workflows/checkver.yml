name: Check Versions

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkver:
    name: Check for stale manifests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out bucket
        uses: actions/checkout@v7

      - name: Set up Scoop
        uses: ./.github/actions/setup-scoop

      - name: Check versions
        shell: pwsh
        env:
          # Scoop uses the GitHub API when a token is available.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-versions.ps1
