name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out bucket
        uses: actions/checkout@v7

      - name: Set up Scoop
        id: scoop
        uses: ./.github/actions/setup-scoop

      - name: Test version checking
        shell: pwsh
        run: ./scripts/tests/check-versions.ps1

      - name: Validate manifest schema
        shell: pwsh
        env:
          SCOOP_ROOT: ${{ steps.scoop.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPaths = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'bucket') -Filter '*.json' -File)
          if ($manifestPaths.Count -eq 0) {
            throw 'No Scoop manifests found in bucket/'
          }

          foreach ($manifestPath in $manifestPaths) {
            $json = Get-Content -Raw $manifestPath.FullName
            Write-Host "Validating $($manifestPath.Name)"
            if (-not (Test-Json -Json $json -SchemaFile (Join-Path $env:SCOOP_ROOT 'schema.json'))) {
              throw "$($manifestPath.Name) does not match Scoop's manifest schema."
            }

            # The schema does not require a URL and hash for every architecture.
            $manifest = $json | ConvertFrom-Json
            if ($manifest.architecture) {
              foreach ($arch in $manifest.architecture.PSObject.Properties) {
                if (-not ($arch.Value.url -or $manifest.url) -or -not ($arch.Value.hash -or $manifest.hash)) {
                  throw "$($manifestPath.Name) is missing a URL or hash for '$($arch.Name)'."
                }
              }
            } elseif (-not $manifest.hash) {
              throw "$($manifestPath.Name) is missing a hash."
            }
          }

      - name: Validate with Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bucket" -Filter '*.json' | ForEach-Object {
            $manifest = Get-Content -Raw $_.FullName | ConvertFrom-Json
            scoop info $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read Scoop information for $($_.Name)."
            }

            if ($manifest.PSObject.Properties.Name.Contains('architecture')) {
              foreach ($arch in $manifest.architecture.PSObject.Properties.Name) {
                scoop download $_.FullName --arch $arch --force --no-update-scoop
                if ($LASTEXITCODE -ne 0) {
                  throw "Download or hash verification failed for $($_.Name) [$arch]."
                }
              }
            } else {
              scoop download $_.FullName --force --no-update-scoop
              if ($LASTEXITCODE -ne 0) {
                throw "Download or hash verification failed for $($_.Name)."
              }
            }
          }

      - name: Test local install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bucket" -Filter '*.json' | ForEach-Object {
            $appName = $_.BaseName
            $manifest = Get-Content -Raw $_.FullName | ConvertFrom-Json

            scoop install $_.FullName --no-cache --no-update-scoop
            if ($LASTEXITCODE -ne 0) {
              throw "Installation failed for $appName."
            }

            $installDir = scoop prefix $appName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $installDir)) {
              throw "$appName install directory was not created"
            }

            if ($manifest.PSObject.Properties.Name.Contains('bin')) {
              $binEntries = @($manifest.bin)
              foreach ($binEntry in $binEntries) {
                if ($binEntry -is [string]) {
                  $binaryPath = $binEntry
                  $commandName = [System.IO.Path]::GetFileNameWithoutExtension((Split-Path -Leaf $binaryPath))
                } else {
                  $binaryPath = $binEntry[0]
                  $commandName = if ($binEntry.Count -gt 1) {
                    [System.IO.Path]::GetFileNameWithoutExtension($binEntry[1])
                  } else {
                    [System.IO.Path]::GetFileNameWithoutExtension((Split-Path -Leaf $binaryPath))
                  }
                }

                $shimDir = Join-Path $env:USERPROFILE 'scoop\shims'
                $shimPath = @('.exe', '.cmd', '.ps1') |
                  ForEach-Object { Join-Path $shimDir "$commandName$_" } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
                if (-not $shimPath) {
                  throw "$commandName shim was not created"
                }

                if (-not (Test-Path (Join-Path $installDir $binaryPath))) {
                  throw "$binaryPath was not installed"
                }
              }
            }
          }

      - name: Test codex-manage version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content -Raw ./bucket/codex-manage.json | ConvertFrom-Json
          $version = codex-manage --version
          if ($LASTEXITCODE -ne 0) {
            throw 'codex-manage --version failed.'
          }
          if ($version -cne "v$($manifest.version)") {
            throw "Expected codex-manage v$($manifest.version), got '$version'."
          }
          Write-Host "codex-manage started successfully: $version"

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bucket" -Filter '*.json' | ForEach-Object {
              $installDir = Join-Path $env:USERPROFILE "scoop\apps\$($_.BaseName)"
              if (Test-Path $installDir) {
                scoop uninstall $_.BaseName
                if ($LASTEXITCODE -ne 0) {
                  throw "Uninstall failed for $($_.BaseName)."
                }
              }
            }
          }
